[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-quota-watch"
version = "0.1.5"
description = "A small local watcher for public Codex quota reset posts"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
codex-quota-watch = "codex_quota_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_quota_watch = ["windows/*.ps1"]
