name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - pyproject.toml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "pyproject version must be a stable x.y.z release; got $tag" >&2
            exit 1
          fi
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" != "$tag" ]]; then
            echo "tag $REF_NAME does not match pyproject version $tag" >&2
            exit 1
          fi
          skip=false
          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "branch" ]] && gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping this main-branch version trigger."
            skip=true
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install local package
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run browser extractor fixture smoke test
        run: node tests/browser_extractor_smoke.cjs
      - name: Build release archives
        run: python scripts/build_release.py --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: codex-quota-watch-release-${{ needs.prepare.outputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [[ "$REF_TYPE" == "branch" ]] && gh release view "$TAG_NAME" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME was created while this workflow was building; leaving its assets untouched."
            exit 0
          fi
          if ! gh release view "$TAG_NAME" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --repo "$REPOSITORY" --target "$TARGET_SHA" --generate-notes
          fi
          gh release upload "$TAG_NAME" dist/* --repo "$REPOSITORY" --clobber
