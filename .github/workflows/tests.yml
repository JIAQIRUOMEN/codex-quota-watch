name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install local package
        run: python -m pip install .
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Run browser extractor fixture smoke test
        run: node tests/browser_extractor_smoke.cjs
      - name: Verify WPF language and acknowledgement behavior
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\popup_language_wpf_smoke.ps1 -TestDirectory "$env:RUNNER_TEMP\quota-watch-wpf"
